# Render Blueprint for Muscly AI-trener (backend/).
# API-nøkkelen settes i Render-dashboardet (sync: false) – den lagres aldri i koden.
services:
  - type: web
    name: muscly-coach
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NODE_VERSION
        value: "22"
